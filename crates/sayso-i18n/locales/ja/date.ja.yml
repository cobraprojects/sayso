_version: 1

# Arguments: %{weekday}, %{month}, %{day}, %{year}. Put them in the order of
# the language, with its words between them ("%{day} de %{month}").
date:
  pattern:
    # In a narrow column of lists: keep it to about 6 characters.
    day_month_short: "%{month}%{day}日"
    day_month: "%{month}%{day}日"
    weekday_day_month: "%{month}%{day}日 %{weekday}"
    day_month_year: "%{year}年%{month}%{day}日"
  today: "今日"
  yesterday: "昨日"
  month:
    january: "1月"
    february: "2月"
    march: "3月"
    april: "4月"
    may: "5月"
    june: "6月"
    july: "7月"
    august: "8月"
    september: "9月"
    october: "10月"
    november: "11月"
    december: "12月"
  month_short:
    january: "1月"
    february: "2月"
    march: "3月"
    april: "4月"
    may: "5月"
    june: "6月"
    july: "7月"
    august: "8月"
    september: "9月"
    october: "10月"
    november: "11月"
    december: "12月"
  weekday:
    monday: "月曜日"
    tuesday: "火曜日"
    wednesday: "水曜日"
    thursday: "木曜日"
    friday: "金曜日"
    saturday: "土曜日"
    sunday: "日曜日"
