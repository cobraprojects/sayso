_version: 1

# Arguments: %{weekday}, %{month}, %{day}, %{year}. Put them in the order of
# the language, with its words between them ("%{day} de %{month}").
date:
  pattern:
    # In a narrow column of lists: keep it to about 6 characters.
    day_month_short: "%{day} %{month}"
    day_month: "%{day} de %{month}"
    weekday_day_month: "%{weekday}, %{day} de %{month}"
    day_month_year: "%{day} de %{month} de %{year}"
  today: "Hoy"
  yesterday: "Ayer"
  month:
    january: "enero"
    february: "febrero"
    march: "marzo"
    april: "abril"
    may: "mayo"
    june: "junio"
    july: "julio"
    august: "agosto"
    september: "septiembre"
    october: "octubre"
    november: "noviembre"
    december: "diciembre"
  month_short:
    january: "ene"
    february: "feb"
    march: "mar"
    april: "abr"
    may: "may"
    june: "jun"
    july: "jul"
    august: "ago"
    september: "sept"
    october: "oct"
    november: "nov"
    december: "dic"
  weekday:
    monday: "lunes"
    tuesday: "martes"
    wednesday: "miércoles"
    thursday: "jueves"
    friday: "viernes"
    saturday: "sábado"
    sunday: "domingo"
