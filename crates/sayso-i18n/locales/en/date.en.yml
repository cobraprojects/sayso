_version: 1

# Arguments: %{weekday}, %{month}, %{day}, %{year}. Put them in the order of
# the language, with its words between them ("%{day} de %{month}").
date:
  pattern:
    # In a narrow column of lists: keep it to about 6 characters.
    day_month_short: "%{month} %{day}"
    day_month: "%{month} %{day}"
    weekday_day_month: "%{weekday}, %{month} %{day}"
    day_month_year: "%{month} %{day}, %{year}"
  today: "Today"
  yesterday: "Yesterday"
  month:
    january: "January"
    february: "February"
    march: "March"
    april: "April"
    may: "May"
    june: "June"
    july: "July"
    august: "August"
    september: "September"
    october: "October"
    november: "November"
    december: "December"
  month_short:
    january: "Jan"
    february: "Feb"
    march: "Mar"
    april: "Apr"
    may: "May"
    june: "Jun"
    july: "Jul"
    august: "Aug"
    september: "Sep"
    october: "Oct"
    november: "Nov"
    december: "Dec"
  weekday:
    monday: "Monday"
    tuesday: "Tuesday"
    wednesday: "Wednesday"
    thursday: "Thursday"
    friday: "Friday"
    saturday: "Saturday"
    sunday: "Sunday"
