_version: 1

# Arguments: %{weekday}, %{month}, %{day}, %{year}. Put them in the order of
# the language, with its words between them ("%{day} de %{month}").
date:
  pattern:
    # In a narrow column of lists: keep it to about 6 characters.
    day_month_short: "%{day} %{month}"
    day_month: "%{day} %{month}"
    weekday_day_month: "%{weekday} %{day} %{month}"
    day_month_year: "%{day} %{month} %{year}"
  today: "Aujourd’hui"
  yesterday: "Hier"
  month:
    january: "janvier"
    february: "février"
    march: "mars"
    april: "avril"
    may: "mai"
    june: "juin"
    july: "juillet"
    august: "août"
    september: "septembre"
    october: "octobre"
    november: "novembre"
    december: "décembre"
  month_short:
    january: "janv."
    february: "févr."
    march: "mars"
    april: "avr."
    may: "mai"
    june: "juin"
    july: "juil."
    august: "août"
    september: "sept."
    october: "oct."
    november: "nov."
    december: "déc."
  weekday:
    monday: "lundi"
    tuesday: "mardi"
    wednesday: "mercredi"
    thursday: "jeudi"
    friday: "vendredi"
    saturday: "samedi"
    sunday: "dimanche"
