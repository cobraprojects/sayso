_version: 1

# Text of the app shell. Shown only on a system that has no backend yet.
app:
  hotkeys_not_built: "Les raccourcis ne sont pas encore disponibles sur ce système."
  insertion_not_built: "L’insertion n’est pas encore disponible sur ce système."
  sign_in:
    start_failed: "Sayso n’a pas pu lancer la connexion : %{error}"
    not_finished: "La connexion n’a pas abouti. Sélectionnez Se connecter pour réessayer."
    code_failed: "Sayso n’a pas pu envoyer le code : %{error}"
  # The status line at the foot of the Hub sidebar.
  engine:
    ready: "Prêt"
    no_model: "Aucun modèle"
    choose_model: "Ouvrez Modèles pour en choisir un"
    download_model: "Ouvrez Modèles pour télécharger"
    stopped: "Moteur arrêté"
    restarting: "Redémarrage…"
    optimizing: "Optimisation"
    downloading: "Téléchargement"
    loading: "Chargement"
    model_error: "Erreur de modèle"
    detail_cloud: "%{model} · Cloud"
    detail_downloading: "%{model} · %{percent} %"
    detail_not_in_memory: "%{model} · pas en mémoire"
