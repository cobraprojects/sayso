      many: "%{number} de dictées"
      other: "%{number} dictées"
    words:
      one: "%{number} mot"
      many: "%{number} de mots"
      other: "%{number} mots"
    replacements:
      one: "%{number} remplacement"
      many: "%{number} de remplacements"
      other: "%{number} remplacements"
    styles:
      one: "%{number} style"
      many: "%{number} de styles"
      other: "%{number} styles"
    added: "Ajouté : %{items}."
    list_separator: ", "
    list_end: "%{first} et %{last}"
    nothing_new: "Tout ce qui vient de Pindrop est déjà dans Sayso."
    failed: "L’importation n’a pas abouti et rien n’a été ajouté : %{reason}. Réessayez."
    style_description: "Importé depuis Pindrop."
