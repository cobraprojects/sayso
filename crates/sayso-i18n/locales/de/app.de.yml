      one: "%{number} Stil"
      other: "%{number} Stile"
    added: "%{items} hinzugefügt."
    list_separator: ", "
    list_end: "%{first} und %{last}"
    nothing_new: "Alles aus Pindrop ist schon in Sayso."
    failed: "Der Import wurde nicht abgeschlossen, und es wurde nichts hinzugefügt: %{reason}. Versuche es erneut."
    style_description: "Aus Pindrop importiert."
