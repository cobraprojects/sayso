    code_failed: "Sayso konnte den Code nicht senden: %{error}"
  # The status line at the foot of the Hub sidebar.
  engine:
    ready: "Bereit"
    no_model: "Kein Modell"
    choose_model: "Öffne „Modelle“, um eines zu wählen"
