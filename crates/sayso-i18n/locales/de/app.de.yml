_version: 1

# Text of the app shell. Shown only on a system that has no backend yet.
app:
  hotkeys_not_built: "Tastenkürzel sind für dieses System noch nicht verfügbar."
  insertion_not_built: "Das Einfügen ist für dieses System noch nicht verfügbar."
  sign_in:
    start_failed: "Sayso konnte die Anmeldung nicht starten: %{error}"
